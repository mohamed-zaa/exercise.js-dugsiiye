<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        table {
            margin: auto;
        }

        input[type="button"] {
            width: 50px;
            height: 40px;
            font-size: 18px;
        }

        input[type="text"] {
            height: 30px;
            font-size: 20px;
            text-align: right;
        }

        input[type="reset"] {
            width: 220px;
            height: 40px;
        }
    </style>
</head>

<body>

<center>

<form> <table border="1" cellpadding="10"> <tr>    <td colspan="4">        <input type="text" name="display" size="25">    </td> </tr><tr>    <td><input type="button" value="7"></td>    <td><input type="button" value="8"></td>    <td><input type="button" value="9"></td>    <td><input type="button" value="/"></td> </tr> <tr>    <td><input type="button" value="4"></td>    <td><input type="button" value="5"></td>    <td><input type="button" value="6"></td>    <td><input type="button" value="*"></td> </tr> <tr>    <td><input type="button" value="1"></td>    <td><input type="button" value="2"></td>    <td><input type="button" value="3"></td>    <td><input type="button" value="-"></td> </tr> <tr>    <td><input type="button" value="0"></td>    <td><input type="button" value="."></td>    <td><input type="button" value="="></td>    <td><input type="button" value="+"></td> </tr> <tr>    <td colspan="4" align="center">        <input type="reset" value="Clear">    </td> </tr> </table> </form>

</center>

<script>
    const buttons = document.querySelectorAll('input[type="button"]');
    const display = document.querySelector('input[name="display"]');

    buttons.forEach(function(button) {
        button.addEventListener("click", function() {

            if (button.value === "=") {
                display.value = eval(display.value);
            } else {
                display.value += button.value;
            }

        });
    });
</script>

</body>
</html>
